name: Package Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64
            os: macos-15-intel
            platform: mac
            arch: x64
          - name: macOS arm64
            os: macos-15-intel
            platform: mac
            arch: arm64
          - name: Windows x64
            os: windows-latest
            platform: win
            arch: x64
          - name: Windows arm64
            os: windows-latest
            platform: win
            arch: arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        if: ${{ !(matrix.platform == 'mac' && matrix.arch == 'arm64') }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prepare MarkItDown
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
          MATRIX_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-markitdown.mjs

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Build renderer
        run: npm run build

      - name: Build main process
        run: npm run build:electron

      - name: Package
        shell: bash
        run: |
          for attempt in 1 2; do
            if npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never; then
              exit 0
            fi
            echo "Packaging failed (attempt $attempt), retrying..."
            sleep 15
          done
          exit 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bennett-toolbox-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error

  test-web:
    name: Web e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx e2e-web install chromium --with-deps

      - name: Run browser e2e
        run: npm run test:e2e

  test-electron:
    name: Electron e2e (macOS x64)
    runs-on: macos-15-intel
    env:
      E2E_SKIP_SCREEN: "1"
      E2E_DISABLE_GPU: "1"
      REAL_MARKITDOWN_BIN: ${{ github.workspace }}/vendor/markitdown/markitdown
      ELECTRON_APP_PATH: ${{ github.workspace }}/release/mac/Bennett Toolbox.app/Contents/MacOS/Bennett Toolbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prepare MarkItDown
        env:
          MATRIX_PLATFORM: mac
          MATRIX_ARCH: x64
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-markitdown.mjs

      - name: Diagnose MarkItDown PDF
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OUT=$(./vendor/markitdown/markitdown tests/fixtures/documents/multi.pdf 2>/tmp/md.err)
          CODE=$?
          echo "exit=$CODE"
          printf '%s\n' "$OUT" | head -5
          echo "stderr:"
          head -100 /tmp/md.err

      - name: Build renderer
        run: npm run build

      - name: Build main process
        run: npm run build:electron

      - name: Package app for e2e
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --dir --mac --x64 --publish never

      - name: Run Electron e2e
        run: node tests/electron.full.mjs

  test-electron-windows:
    name: Electron e2e (Windows x64)
    runs-on: windows-latest
    env:
      E2E_SKIP_SCREEN: "1"
      E2E_DISABLE_GPU: "1"
      REAL_MARKITDOWN_BIN: ${{ github.workspace }}/vendor/markitdown/markitdown.exe
      ELECTRON_APP_PATH: ${{ github.workspace }}/release/win-unpacked/Bennett Toolbox.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prepare MarkItDown
        env:
          MATRIX_PLATFORM: win
          MATRIX_ARCH: x64
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-markitdown.mjs

      - name: Build renderer
        run: npm run build

      - name: Build main process
        run: npm run build:electron

      - name: Package app for e2e
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --dir --win --x64 --publish never

      - name: Run Electron e2e
        run: node tests/electron.full.mjs

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-web, test-electron, test-electron-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach packages to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          overwrite_files: true
